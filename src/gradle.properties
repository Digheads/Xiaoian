org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35

termuxX11VersionName=1.03.01

# No org.gradle.java.home here: the JDK path is per machine and the CI runner
# is Linux. Set it in ~/.gradle/gradle.properties (see README) or leave it to
# JAVA_HOME / Android Studio's Gradle JDK.

# Native build (:anland, :terminal). The NDK is what the app is verified with; the CMake
# version has to match what local.properties (cmake.dir) or the SDK provides.
nativeNdkVersion=29.0.14206865
nativeCmakeVersion=4.3.4

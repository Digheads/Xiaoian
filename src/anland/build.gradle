apply plugin: 'com.android.library'

android {
    namespace 'com.anland.termux'
    buildToolsVersion "36.0.0"
    compileSdk 35
    ndkVersion nativeNdkVersion

    defaultConfig {
        minSdkVersion 28
        targetSdkVersion 35

        consumerProguardFiles 'proguard-rules.pro'

        // Built from src/main/jni, not shipped as prebuilts: a prebuilt .so
        // and the sources beside it drift apart, and once did -- a missing
        // Native method crashed MainActivity on the first surfaceChanged.
        //
        // arm64 only: the Debian rootfs and the desktop it renders are arm64,
        // and the display consumer needs memfd_create, which bionic only
        // declares from API 30. KDE needs Android 11 anyway (see the device
        // support screen), while the app itself still starts on API 28.
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_PLATFORM=android-30'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version nativeCmakeVersion
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_9
        targetCompatibility JavaVersion.VERSION_1_9
    }
    
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    
    buildFeatures {
        aidl = true
        buildConfig = true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.0"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
}

# Builds a complete Xiaoian release: the signed APK and the chroot's Mesa
# driver package, published together on a v* tag.
#
#   push a tag v*                  -> both builds, then a GitHub release
#   Run workflow, with a tag        -> the same; the tag is created on the
#                                      commit the run is started from
#   Run workflow, tag left empty    -> both builds as artifacts, no release
#
# Signing uses the repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS and KEY_PASSWORD (see README). Without them the APK is unsigned.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0 or v0.2.0-alpha). Empty: trial run, no release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # Mesa for the Debian chroot: glibc, so it builds natively on arm64 in a
  # trixie container, not with the NDK. The finished package is cached under
  # the hash of mesa/, so it is only rebuilt when the pin or the build changes.
  mesa:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
    steps:
      # The container has no git yet, so checkout falls back to a plain
      # download; the repo is small and submodules are not fetched here.
      - uses: actions/checkout@v7

      - name: Restore package
        id: pkg
        uses: actions/cache/restore@v6
        with:
          path: out
          key: mesa-pkg-${{ hashFiles('mesa/**') }}

      - name: Install build dependencies
        if: steps.pkg.outputs.cache-hit != 'true'
        run: bash mesa/build.sh deps

      - name: Restore ccache
        if: steps.pkg.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: /root/.ccache
          key: mesa-ccache-${{ github.run_id }}
          restore-keys: mesa-ccache-

      - name: Build Mesa
        if: steps.pkg.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: /root/.ccache
          CCACHE_MAXSIZE: 2G
        run: bash mesa/build.sh build out

      - name: Save ccache
        if: always() && steps.pkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /root/.ccache
          key: mesa-ccache-${{ github.run_id }}

      - name: Save package
        if: steps.pkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: out
          key: mesa-pkg-${{ hashFiles('mesa/**') }}

      - uses: actions/upload-artifact@v7
        with:
          name: mesa
          path: out/*
          if-no-files-found: error

  apk:
    runs-on: ubuntu-24.04
    steps:
      # Full history: versionCode is the commit count, and the Gradle build
      # refuses a shallow clone rather than produce versionCode 1.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      # A manual release: tag the commit here, before the build, so that
      # versionName (git describe) is the tag and not the bare hash. Only
      # local; the release job publishes it. An existing tag stops the run
      # instead of overwriting a release.
      - name: Tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Tag must look like v0.2.0 or v0.2.0-alpha, got '$TAG'"; exit 1 ;;
          esac
          git tag "$TAG" || { echo "::error::Tag $TAG already exists"; exit 1; }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # :lorie builds with r26d (the X server's libx11 predates newer bionic
      # headers), :anland and :terminal with r29; see src/gradle.properties.
      - name: Install NDKs
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;26.3.11579264" "ndk;29.0.14206865" > /dev/null

      # AGP wants exactly nativeCmakeVersion (4.3.4), with ninja beside it.
      # bison is xkbcomp's parser generator (tools/winflexbison on Windows).
      - name: Install CMake, Ninja and bison
        run: |
          sudo apt-get install -y --no-install-recommends ninja-build bison ccache
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v4.3.4/cmake-4.3.4-linux-x86_64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          CMAKE_DIR="$RUNNER_TEMP/cmake-4.3.4-linux-x86_64"
          cp /usr/bin/ninja "$CMAKE_DIR/bin/"
          printf 'sdk.dir=%s\ncmake.dir=%s\n' "$ANDROID_SDK_ROOT" "$CMAKE_DIR" > src/local.properties

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets; the release APK will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > src/xiaoian-release.jks
          {
            echo "storeFile=xiaoian-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > src/keystore.properties

      # The native code (above all the X server with its 16 source trees) is
      # what takes the time: a local build is incremental, but every run here
      # starts from an empty machine. Caching the .cxx directories would not
      # help -- after a fresh checkout every source is newer than its object
      # and ninja rebuilds all of it -- so ccache, which goes by content.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: apk-ccache-${{ github.run_id }}
          restore-keys: apk-ccache-

      # gradlew is committed without the exec bit; chmod would show up as a
      # change and put "-dirty" into versionName.
      #
      # CMake takes CMAKE_<LANG>_COMPILER_LAUNCHER from the environment, so
      # the build files need no ccache setting. The compiler is identified by
      # its --version: NDK 26.3 is reinstalled on every run, and ccache's
      # default (the binary's mtime) would then miss every time.
      - name: Build
        working-directory: src
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 1G
          CCACHE_COMPILERCHECK: '%compiler% --version'
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
        run: |
          ccache --zero-stats
          bash ./gradlew :app:assembleRelease
          ccache --show-stats

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: apk-ccache-${{ github.run_id }}

      - name: Collect APK
        run: |
          version=$(git describe --tags --always --dirty | sed 's/^v//')
          mkdir dist
          for f in src/app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *-unsigned.apk) cp "$f" "dist/xiaoian-$version-unsigned.apk" ;;
              *)              cp "$f" "dist/xiaoian-$version.apk" ;;
            esac
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [mesa, apk]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          rm -f *.sha256
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A tag with a suffix (v0.2.0-alpha) is a pre-release. The scripts still
      # find its Mesa package: fetch_asset falls back from releases/latest,
      # which skips pre-releases, to the full release list.
      # On a manual run the tag does not exist on GitHub yet; the action
      # creates it on the commit that was built. Tags made with the workflow's
      # own token do not trigger workflows, so this does not start a second run.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
